kind = "mobile"
previewPath = "/mobile/"
title = "Fit Club Mobile"
description = "Native mobile app for Fit Club members. Log in with email, view upcoming and past sessions from Acuity Scheduling, and book new sessions with one tap."
version = "1.0.0"
id = "artifacts/fit-club-mobile"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/mobile/" ]
localPort = 18568

[services.development]
run = "pnpm --filter @workspace/fit-club-mobile run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/fit-club-mobile", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/fit-club-mobile", "run", "serve" ]

[services.env]
PORT = "18568"
BASE_PATH = "/mobile/"
