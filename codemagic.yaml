workflows:
  ios-release:
    name: iOS App Store Release
    max_build_duration: 120
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: Fit Club ASC
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.fitclub15.app
      node: latest
    scripts:
      - name: Install pnpm
        script: npm install -g pnpm
      - name: Install dependencies
        script: |
          cd $CM_BUILD_DIR
          pnpm install --frozen-lockfile
      - name: Expo prebuild
        script: |
          cd $CM_BUILD_DIR/artifacts/fit-club-mobile
          npx expo prebuild --platform ios --clean --no-install
      - name: Build iOS
        script: |
          cd $CM_BUILD_DIR/artifacts/fit-club-mobile/ios
          xcode-project use-profiles
          xcodebuild \
            -workspace fitclub15.xcworkspace \
            -scheme fitclub15 \
            -configuration Release \
            -archivePath $CM_BUILD_DIR/build/app.xcarchive \
            archive \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM=$(echo $CM_CERTIFICATE | openssl x509 -noout -subject 2>/dev/null | grep -o 'OU=[^/]*' | cut -d= -f2 || echo "")
          xcodebuild \
            -exportArchive \
            -archivePath $CM_BUILD_DIR/build/app.xcarchive \
            -exportPath $CM_BUILD_DIR/build/ \
            -exportOptionsPlist $CM_EXPORT_OPTIONS_PATH
    artifacts:
      - build/**/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
