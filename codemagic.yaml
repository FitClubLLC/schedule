workflows:
  ios-release:
    name: iOS App Store Release
    max_build_duration: 120
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: Fit Club ASC
    environment:
      groups:
        - fitclub_production
      vars:
        APP_STORE_APPLE_ID: "6798079649"
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.fitclub15.app
      node: latest
    scripts:
      - name: Enable pnpm
        script: |
          cd $CM_BUILD_DIR
          corepack enable
          pnpm --version
      - name: Install dependencies
        script: |
          cd $CM_BUILD_DIR
          pnpm install --frozen-lockfile
      - name: Expo prebuild
        script: |
          cd $CM_BUILD_DIR/artifacts/fit-club-mobile
          npx expo prebuild --platform ios --clean --no-install
      - name: Install CocoaPods dependencies
        script: |
          cd $CM_BUILD_DIR/artifacts/fit-club-mobile/ios
          pod install --repo-update
      - name: Increment iOS build number
        script: |
          set -euo pipefail
          cd $CM_BUILD_DIR/artifacts/fit-club-mobile/ios
          LATEST_BUILD_NUMBER=$(app-store-connect get-latest-app-store-build-number --platform IOS "$APP_STORE_APPLE_ID")
          NEXT_BUILD_NUMBER=$((LATEST_BUILD_NUMBER + 1))
          echo "Using iOS build number: $NEXT_BUILD_NUMBER"
          agvtool new-version -all "$NEXT_BUILD_NUMBER"
      - name: Build iOS
        script: |
          set -o pipefail
          cd $CM_BUILD_DIR/artifacts/fit-club-mobile/ios
          xcode-project use-profiles
          xcode-project build-ipa --workspace FITCLUB15.xcworkspace --scheme FITCLUB15
    artifacts:
      - $CM_BUILD_DIR/artifacts/fit-club-mobile/ios/build/ios/ipa/*.ipa
      - build/**/*.xcarchive
      - build/**/*.dSYM
      - build/**/*.dSYM.zip
      - build/xcodebuild-*.log
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
