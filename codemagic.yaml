workflows:
  ios-release:
    name: iOS App Store Release
    max_build_duration: 120
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: Fit Club ASC
    environment:
      groups:
        - fitclub_production
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.fitclub15.app
      node: latest
    scripts:
      - name: Enable pnpm
        script: |
          cd $CM_BUILD_DIR
          corepack enable
          pnpm --version
      - name: Install dependencies
        script: |
          cd $CM_BUILD_DIR
          pnpm install --frozen-lockfile
      - name: Expo prebuild
        script: |
          cd $CM_BUILD_DIR/artifacts/fit-club-mobile
          npx expo prebuild --platform ios --clean --no-install
      - name: Install CocoaPods dependencies
        script: |
          cd $CM_BUILD_DIR/artifacts/fit-club-mobile/ios
          pod install --repo-update
      - name: Build iOS
        script: |
          set -o pipefail
          cd $CM_BUILD_DIR/artifacts/fit-club-mobile/ios
          xcode-project use-profiles
          mkdir -p $CM_BUILD_DIR/build
          xcodebuild \
            -workspace fitclub15.xcworkspace \
            -scheme fitclub15 \
            -configuration Release \
            -archivePath $CM_BUILD_DIR/build/app.xcarchive \
            archive 2>&1 | tee $CM_BUILD_DIR/build/xcodebuild-archive.log
          xcodebuild \
            -exportArchive \
            -archivePath $CM_BUILD_DIR/build/app.xcarchive \
            -exportPath $CM_BUILD_DIR/build/ \
            -exportOptionsPlist $CM_EXPORT_OPTIONS_PATH 2>&1 | tee $CM_BUILD_DIR/build/xcodebuild-export.log
    artifacts:
      - build/**/*.ipa
      - build/**/*.xcarchive
      - build/**/*.dSYM
      - build/**/*.dSYM.zip
      - build/xcodebuild-*.log
      - /tmp/xcodebuild_logs/*.log
