workflows:
  ios-release:
    name: iOS App Store Release
    max_build_duration: 120
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: Fit Club ASC
    environment:
      groups:
        - fitclub_production
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.fitclub15.app
      node: latest
    scripts:
      - name: Enable pnpm
        script: |
          cd $CM_BUILD_DIR
          corepack enable
          pnpm --version
      - name: Install dependencies
        script: |
          cd $CM_BUILD_DIR
          pnpm install --frozen-lockfile
      - name: Expo prebuild
        script: |
          cd $CM_BUILD_DIR/artifacts/fit-club-mobile
          npx expo prebuild --platform ios --clean --no-install
      - name: Install CocoaPods dependencies
        script: |
          cd $CM_BUILD_DIR/artifacts/fit-club-mobile/ios
          pod install --repo-update
      - name: Build iOS
        script: |
          set -o pipefail
          cd $CM_BUILD_DIR/artifacts/fit-club-mobile/ios
          xcode-project use-profiles
          xcode-project build-ipa --workspace FITCLUB15.xcworkspace --scheme FITCLUB15
    artifacts:
      - artifacts/fit-club-mobile/ios/build/ios/ipa/*.ipa
      - build/**/*.xcarchive
      - build/**/*.dSYM
      - build/**/*.dSYM.zip
      - build/xcodebuild-*.log
      - /tmp/xcodebuild_logs/*.log
