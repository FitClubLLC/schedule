workflows:
  ios-release:
    name: iOS App Store Release
    max_build_duration: 120
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: Fit Club ASC
    environment:
      groups:
        - fitclub_production
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.fitclub15.app
      node: latest
    scripts:
      - name: Enable pnpm
        script: |
          cd $CM_BUILD_DIR
          corepack enable
          pnpm --version
      - name: Install dependencies
        script: |
          cd $CM_BUILD_DIR
          pnpm install --frozen-lockfile
      - name: Expo prebuild
        script: |
          cd $CM_BUILD_DIR/artifacts/fit-club-mobile
          npx expo prebuild --platform ios --clean --no-install
      - name: Install CocoaPods dependencies
        script: |
          cd $CM_BUILD_DIR/artifacts/fit-club-mobile/ios
          pod install --repo-update
      - name: Inspect generated iOS schemes
        script: |
          set -o pipefail
          cd $CM_BUILD_DIR/artifacts/fit-club-mobile/ios
          echo "Generated workspaces:"
          find . -maxdepth 1 -name '*.xcworkspace' -print
          echo "Generated projects:"
          find . -maxdepth 1 -name '*.xcodeproj' -print
          for workspace in ./*.xcworkspace; do
            [ -e "$workspace" ] || continue
            echo "=== xcodebuild -list for $workspace ==="
            xcodebuild -list -workspace "$workspace"
          done
    artifacts:
      - build/**/*.ipa
      - build/**/*.xcarchive
      - build/**/*.dSYM
      - build/**/*.dSYM.zip
      - build/xcodebuild-*.log
      - /tmp/xcodebuild_logs/*.log
